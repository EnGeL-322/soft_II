server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El backend (Java 17 + Spring Boot) vive en otro contenedor: nginx lo expone bajo el mismo
    # origen que el SPA para que el navegador nunca necesite CORS ni conocer su URL real.
    location /api/ws/ {
        access_log off;
        proxy_pass http://backend:8080/api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        # nginx rechaza por defecto cuerpos de mas de 1 MB: la foto del voucher (hasta 8 MB, ver
        # spring.servlet.multipart.max-file-size) nunca llegaria al backend.
        client_max_body_size 10m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # APK de la app movil (volumen ./descargas en docker-compose). Sin cache: el nombre no cambia
    # entre versiones, y un APK viejo cacheado haria que la app pida actualizar para siempre.
    location /descargas/ {
        alias /usr/share/nginx/descargas/;
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-cache" always;
    }

    # Los .js/.css de Angular llevan hash en el nombre (main-QHI3KPBK.js): si cambian, cambia el
    # nombre, asi que se pueden guardar para siempre.
    location ~* \.(?:js|css|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html (y cualquier ruta de la SPA) nunca se reutiliza sin preguntar: tras un despliegue,
    # un index.html viejo apunta a chunks que ya no existen y la pantalla queda en blanco.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
