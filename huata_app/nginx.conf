server {
    listen 80;
    # El healthcheck de docker-compose corre `wget http://localhost/` DENTRO del contenedor, y
    # wget resuelve "localhost" a IPv6 (::1) primero. Sin este listener, esa conexión se rechaza
    # aunque el sitio funcione bien por IPv4 (que es lo único que publica docker-compose.yml), y
    # el contenedor queda marcado "unhealthy" para siempre pese a responder normal.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mismo patron que huata-web/nginx.conf: el backend queda bajo el mismo origen que el build
    # web, asi ApiConfig.baseUrl (que en web usa una ruta relativa "/api/v1") funciona sin CORS y
    # sin tener que hornear una URL fija en el bundle.
    location /api/ws/ {
        # El handshake de puntos en navegador puede llevar JWT: no registrar query strings.
        access_log off;
        proxy_pass http://backend:8080/api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        # nginx rechaza por defecto cuerpos de mas de 1 MB: la foto del voucher (hasta 8 MB, ver
        # spring.servlet.multipart.max-file-size) nunca llegaria al backend.
        client_max_body_size 10m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Flutter web no pone hash en el nombre de main.dart.js, index.html ni flutter_bootstrap.js:
        # sin esto el navegador reutiliza la copia vieja tras un rebuild y los cambios "no aparecen".
        # no-cache no impide guardarlo: obliga a revalidar con el ETag (304 si no cambió).
        add_header Cache-Control "no-cache" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm;
}
