; ARI: la interfaz con la que huata-ivr (Spring Boot) controla cada llamada.
[general]
enabled=yes
pretty=no

; Usuario de la aplicacion. La contrasena se genera EN EL EQUIPO y no se sube al repositorio:
;   openssl rand -base64 24
; y se pone la misma en /etc/huata-ivr.env (HUATA_ARI_PASSWORD).
[huata-ivr]
type=user
read_only=no
password=CAMBIAR_EN_EL_EQUIPO
password_format=plain
