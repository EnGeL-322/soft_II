; Plan de marcado minimo: Asterisk solo entrega la llamada a huata-ivr. Toda la logica (menu,
; reintentos, devolucion de llamada) vive en el servicio Java, para que el dialplan no se convierta
; en un segundo lugar con reglas de negocio.
[general]
static=yes
writeprotect=yes

; Llamadas entrantes de los modems. chan_quectel las entrega en la extension "s" del contexto
; configurado en quectel.conf.
; QUECTELNAME = nombre de la linea en quectel.conf (en chan_dongle la variable se llama DONGLENAME;
; verificar en la documentacion del fork instalado). huata-ivr decide con ese nombre si la linea
; CONTESTA o DEVUELVE la llamada (application.yml).
[entrante]
exten => s,1,NoOp(IVR: llamada de ${CALLERID(num)} por ${QUECTELNAME})
 same => n,Set(CHANNEL(language)=es)
 same => n,Stasis(huata-ivr,entrante,${QUECTELNAME})
 same => n,Hangup()

; Si el driver entrega el numero propio como extension, se trata igual.
exten => _X.,1,Goto(entrante,s,1)
exten => _+X.,1,Goto(entrante,s,1)

; Solo para pruebas desde la consola de Asterisk (originate): llamar a un celular por el grupo 1.
; Las devoluciones reales las origina huata-ivr por ARI directo a Stasis, sin pasar por aqui.
[pruebas]
exten => _9XXXXXXXX,1,Dial(Quectel/g1/+51${EXTEN},30)
 same => n,Hangup()
