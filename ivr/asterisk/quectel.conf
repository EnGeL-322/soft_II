; Lineas del IVR: un modem USB (Quectel EC25-AU o SIM7600SA-H) por SIM.
; EJEMPLO a contrastar con el quectel.conf de ejemplo del fork instalado: los nombres de algunas
; opciones cambian entre versiones del driver.
;
; Cada linea se identifica por el IMEI del modem (impreso en la etiqueta, o con AT+GSN), no por el
; puerto /dev/ttyUSBx: los puertos cambian de numero al reiniciar o al reconectar el hub.

[general]
interval=15                 ; segundos entre intentos de reconectar un modem caido

[defaults]
context=entrante            ; ver extensions.conf
group=1                     ; todas las lineas en el grupo 1 (para llamadas salientes de prueba)
language=es
rxgain=0
txgain=0
resetquectel=yes            ; reiniciar el modem si deja de responder
u2diag=-1
callwaiting=no              ; una llamada a la vez por linea; la segunda recibe ocupado
disablesms=yes              ; el IVR no usa SMS
autodeletesms=yes
usecallingpres=yes
callingpres=allowed_passed_screen
; Deteccion de teclas (DTMF): valores iniciales; ajustar en las pruebas de laboratorio con
; celulares basicos de cada operadora (seccion 8 del README).
mindtmfgap=45
mindtmfduration=80
mindtmfinterval=200
; Voz por USB (UAC) en Quectel EC25: activar en el modem con AT+QPCMV=1,2 (ver guia del driver).
quec_uac=1

; ---- Una seccion por linea. El nombre de la seccion es el que usa application.yml ----

[linea_claro]
imei=000000000000000        ; REEMPLAZAR por el IMEI real del modem con la SIM Claro

[linea_entel]
imei=000000000000000        ; REEMPLAZAR

[linea_bitel]
imei=000000000000000        ; REEMPLAZAR

[linea_extra]
imei=000000000000000        ; REEMPLAZAR (segunda SIM de la operadora mas usada)
