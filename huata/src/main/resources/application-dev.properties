# Perfil DEV: PostgreSQL real, el mismo motor que produccion. Se levanta con:
#
#     docker compose up -d db
#
# POR QUE YA NO ES H2: al versionar el esquema con Flyway, mantener dev en H2 dejaba dos opciones,
# ambas malas: escribir cada migracion dos veces (dialectos distintos) o dejar dev sin migraciones.
# En los dos casos el esquema de dev y el de produccion terminan divergiendo, que es exactamente lo
# que Flyway viene a evitar.
#
# TRADE-OFF ASUMIDO: para arrancar el backend desde el IDE ahora hace falta Docker corriendo, y se
# pierde la consola H2. Para inspeccionar la base: DBeaver o psql contra localhost:5432.
#
# Los valores por defecto coinciden con los del .env de desarrollo local. Si cambias DB_PASSWORD en
# el .env, exporta el mismo valor en la configuracion de ejecucion del IDE.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:huata}
spring.datasource.username=${DB_USER:huata}
spring.datasource.password=${DB_PASSWORD:huata}
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema lo gobierna Flyway, no Hibernate. "validate" no modifica nada: comprueba que las
# entidades coinciden con lo que crearon las migraciones y falla el arranque si alguien cambio una
# entidad sin escribir su migracion. Ese fallo es el objetivo, no un inconveniente.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# V1..V46 se consolidaron en B46__esquema_consolidado.sql. Las bases ya creadas con V1..V46 tienen
# esas filas en flyway_schema_history; sin esto Flyway aborta con "applied migration not resolved
# locally" (la 46, al ser la ultima aplicada, Flyway la clasifica como "future"). Solo ignora
# migraciones ausentes: los checksums de las presentes se siguen validando.
spring.flyway.ignore-migration-patterns=*:missing,*:future

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Carga datos de ejemplo marcados como DEMO (nunca en produccion)
huata.seed.demo-data=true

# Vivienda al azar dentro de la zona al dar de alta un proveedor (UbicacionSimuladaService)
huata.simulacion.ubicacion-proveedores=${HUATA_SIMULAR_UBICACIONES:true}

# Swagger UI disponible en http://localhost:8080/swagger-ui.html mientras se desarrolla.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
