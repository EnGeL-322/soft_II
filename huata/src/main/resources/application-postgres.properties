# Perfil POSTGRES: base de datos objetivo segun el Project Charter (Angular + Spring Boot +
# PostgreSQL). Usar junto con docker-compose.yml o una instancia propia de PostgreSQL.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:huata}
spring.datasource.username=${DB_USER:huata}
spring.datasource.password=${DB_PASSWORD:huata}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Por defecto NO se siembran datos DEMO sobre una base de datos real.
huata.seed.demo-data=${HUATA_SEED_DEMO:false}
