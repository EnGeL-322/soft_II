spring.application.name=huata
# El handshake web admite JWT en parámetro; no volcar URI/cabeceras con logs DEBUG/TRACE de Spring.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.messaging=INFO
server.port=8080

# Perfiles: dev (H2 en memoria, datos DEMO), test (lo activa Maven al correr las pruebas) y prod
# (PostgreSQL real, sin secretos por defecto). El docker-compose de la raiz levanta el backend con
# el perfil prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JWT (el secreto por defecto es SOLO para desarrollo local, no usar en produccion)
huata.security.jwt.secret=${HUATA_JWT_SECRET:huata-lacteos-clave-secreta-desarrollo-cambiar-en-produccion-1234567890}
huata.security.jwt.expiration-minutes=${HUATA_JWT_EXPIRATION_MIN:480}

# CORS para el frontend Angular (ng serve)
huata.security.cors.allowed-origins=${HUATA_CORS_ORIGINS:http://localhost:4200}

# Clave del equipo de domotica para POST /api/v1/ingesta/**. Vacia por defecto: sin configurarla,
# la ruta responde 401. Nunca se pone un valor real aqui (ver .env.example).
huata.security.ingesta.api-key=${HUATA_INGESTA_API_KEY:}

# Clave del IVR telefonico para /api/v1/ivr/** (ivr/README.md). Vacia = nadie entra. Distinta de la
# de ingesta para poder revocarlas por separado.
huata.security.ivr.api-key=${HUATA_IVR_API_KEY:}

# Equipo de medicion (ESP32) que responde a "Llamar datos". Vacio = boton deshabilitado y captura
# manual. Ej: http://192.168.1.50/lectura
huata.instrumento.url=${HUATA_INSTRUMENTO_URL:}

# Codigo de verificacion de Configuracion (cambios de precio). Cuanto dura antes de vencer.
huata.verificacion.minutos-vigencia=${HUATA_VERIFICACION_MIN:10}
huata.verificacion.remitente=${MAIL_FROM:no-reply@huata.coop}

# El SMTP NO se declara aqui a proposito. spring.mail.host se pone por entorno
# (SPRING_MAIL_HOST, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD): si estuviera declarado con valor
# vacio, Spring crearia igualmente un JavaMailSender apuntando a ninguna parte y cada envio fallaria
# con un error de conexion. Sin la propiedad no hay bean, y EnviadorDeCodigo escribe el codigo en el
# log — que es lo que queremos en dev y en las pruebas. Con Gmail hace falta una contrasena de
# aplicacion, nunca la del correo, y nunca en el repositorio.

spring.jackson.default-property-inclusion=non_null

# Actuator: solo health e info. El resto de endpoints queda cerrado; se amplia en la Fase 3
# cuando entren Prometheus y Grafana (DESARROLLO.md seccion 9, Fase 3).
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# El correo es opcional (ver nota de arriba): sin SPRING_MAIL_HOST no hay envio real, se escribe en
# el log. Pero Spring Boot autoconfigura igual un JavaMailSender con host por defecto aunque la
# propiedad este vacia, y sin esto MailHealthIndicator intenta conectarse y falla: /actuator/health
# queda DOWN y docker-compose.yml (healthcheck del backend) tumba el arranque de frontend/movil, que
# dependen de "service_healthy". El correo no es una dependencia critica del sistema, asi que no
# debe poder tumbar el healthcheck.
management.health.mail.enabled=false

# Portal publico: cuantas consultas por codigo de proveedor admite un mismo origen cada minuto.
# Frena recorrer el padron a fuerza de intentos, que importa mas desde que el codigo del proveedor es
# su DNI (seccion 36.14). Un proveedor consultando su propia calidad hace una peticion, no veinte.
# 0 o menos desactiva el limite.
huata.portal.consultas-por-minuto=${HUATA_PORTAL_CONSULTAS_POR_MINUTO:20}

# App movil (APK directo): version publicada, minima aceptada y de donde se descarga. La app lo
# consulta al abrir (VersionAppMovilController). Los parches de codigo Dart llegan por Shorebird y no
# necesitan tocar esto; solo una version nueva del APK (cambios nativos). Vacio = nada que ofrecer.
huata.app-movil.version-actual=${HUATA_APP_VERSION_ACTUAL:}
huata.app-movil.version-minima=${HUATA_APP_VERSION_MINIMA:}
huata.app-movil.url-descarga=${HUATA_APP_URL_DESCARGA:}
huata.app-movil.notas=${HUATA_APP_NOTAS:}

# OpenAPI/Swagger: el contrato de la API se genera del codigo (seccion 5.3). Queda deshabilitado
# en el perfil prod (ver application-prod.properties).
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ---- Archivos de evidencia (fotos de voucher, RNF-13, seccion 24) ----
# Con HUATA_MINIO_ENDPOINT se guardan en MinIO/S3; vacio, en un directorio del disco (solo para
# desarrollo y pruebas: en un contenedor sin volumen se pierden al recrearlo).
huata.almacen.minio.endpoint=${HUATA_MINIO_ENDPOINT:}
huata.almacen.minio.access-key=${HUATA_MINIO_ACCESS_KEY:}
huata.almacen.minio.secret-key=${HUATA_MINIO_SECRET_KEY:}
huata.almacen.minio.bucket=${HUATA_MINIO_BUCKET:huata-evidencias}
huata.almacen.directorio=${HUATA_ALMACEN_DIRECTORIO:${java.io.tmpdir}/huata-evidencias}
# Una foto de voucher a 2000 px pesa ~0,5-1,5 MB; 8 MB deja margen sin permitir abusos.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
