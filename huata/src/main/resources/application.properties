spring.application.name=huata
server.port=8080

# Perfil activo por defecto: dev (H2 en memoria). Cambiar a "postgres" para la base de datos
# real (ver docker-compose.yml y application-postgres.properties), tal como pide el Charter.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JWT (el secreto por defecto es SOLO para desarrollo local, no usar en produccion)
huata.security.jwt.secret=${HUATA_JWT_SECRET:huata-lacteos-clave-secreta-desarrollo-cambiar-en-produccion-1234567890}
huata.security.jwt.expiration-minutes=${HUATA_JWT_EXPIRATION_MIN:480}

# CORS para el frontend Angular (ng serve)
huata.security.cors.allowed-origins=${HUATA_CORS_ORIGINS:http://localhost:4200}

spring.jackson.default-property-inclusion=non_null
