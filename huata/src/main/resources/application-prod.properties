# Perfil PROD: PostgreSQL real, sin datos DEMO, sin consola H2 y sin Swagger publicado.
#
# Este perfil NO trae valores por defecto para los secretos a proposito: si falta una variable de
# entorno, la aplicacion falla al arrancar en vez de levantar con una credencial conocida. Las
# variables se documentan en el .env.example de la raiz del monorepo.
#
# Sustituye al antiguo perfil "postgres" (mismo contenido, nombre alineado con dev/test/prod que
# pide la Fase 0).

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema lo gobierna Flyway (migraciones versionadas en db/migration), no Hibernate. Esto
# sustituye al antiguo ddl-auto=update, que no versionaba nada y no sabia borrar ni renombrar
# columnas. "validate" solo comprueba que las entidades coinciden con el esquema migrado y aborta el
# arranque si no coinciden; nunca modifica la base.
#
# IMPORTANTE: no volver a poner "update" aqui. Con Hibernate parcheando el esquema por detras, las
# migraciones dejan de ser la fuente de verdad y Flyway pasa a ser decorativo.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# V1..V46 se consolidaron en B46__esquema_consolidado.sql. Las bases ya creadas con V1..V46 tienen
# esas filas en flyway_schema_history; sin esto Flyway aborta con "applied migration not resolved
# locally" (la 46, al ser la ultima aplicada, Flyway la clasifica como "future"). Solo ignora
# migraciones ausentes: los checksums de las presentes se siguen validando.
spring.flyway.ignore-migration-patterns=*:missing,*:future
# Falla el arranque si alguien edito una migracion ya aplicada (checksum distinto) en vez de
# escribir una nueva.
spring.flyway.validate-on-migrate=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Datos DEMO: por defecto NO. Se deja como variable, y no fijo en false, porque hoy es la unica
# forma de que el docker-compose arranque con un usuario con el que iniciar sesion.
#
# RIESGO ASUMIDO: con HUATA_SEED_DEMO=true se crean usuarios con una contrasena que esta en el
# repositorio. Nunca debe ponerse en true en un entorno con datos reales. Lo que cierra este agujero
# de verdad es un comando de creacion del primer administrador (pendiente de la Fase 2).
huata.seed.demo-data=${HUATA_SEED_DEMO:false}

# Solo demostraciones: al dar de alta un proveedor le pone una vivienda al azar dentro del poligono
# de su zona (UbicacionSimuladaService). Nunca en true con datos reales.
huata.simulacion.ubicacion-proveedores=${HUATA_SIMULAR_UBICACIONES:false}

# Sin secretos por defecto: obligatorios como variable de entorno.
huata.security.jwt.secret=${HUATA_JWT_SECRET}
huata.security.cors.allowed-origins=${HUATA_CORS_ORIGINS}

# Superficie minima expuesta en produccion.
spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
