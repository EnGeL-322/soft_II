# Perfil TEST: lo activa maven-surefire (ver pom.xml), no hay que configurar nada a mano.
#
# H2 en memoria y base nueva por ejecucion. Siembra los datos DEMO porque las pruebas actuales
# parten de ellos; las pruebas de la Fase 1 construiran sus propios datos (patron AAA) y las de
# integracion usaran Testcontainers + PostgreSQL, no este perfil.
spring.datasource.url=jdbc:h2:mem:huata-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway APAGADO en este perfil: las migraciones estan escritas en dialecto PostgreSQL y no corren
# sobre H2. Estos tests siguen usando el esquema que genera Hibernate, que es rapido y no necesita
# Docker.
#
# CONSECUENCIA A TENER PRESENTE: estos tests NO comprueban las migraciones. Quien verifica que
# V1/V2 producen un esquema identico al que esperan las entidades es MigracionesFlywayIT, que
# levanta PostgreSQL real con Testcontainers.
spring.flyway.enabled=false

spring.h2.console.enabled=false
huata.seed.demo-data=true

huata.security.jwt.secret=clave-solo-para-pruebas-automatizadas-no-usar-en-ningun-entorno-real
huata.security.cors.allowed-origins=http://localhost:4200
huata.almacen.directorio=target/test-evidencias
